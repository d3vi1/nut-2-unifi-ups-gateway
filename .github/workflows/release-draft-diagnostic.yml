name: Read-only draft visibility diagnostic

on:
  push:
    branches: [release/recover-0.9.0]

permissions: {}

jobs:
  inspect:
    if: github.repository == 'd3vi1/nut-2-unifi-ups-gateway'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout or third-party action. Both credentials perform only GETs
      # against this exact unpublished reservation; no bodies or secrets print.
      - name: Compare policy and ephemeral writer draft visibility
        env:
          POLICY_TOKEN: ${{ secrets.N2U_RELEASE_POLICY_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          for (const [credential, token] of [
            ['policy', process.env.POLICY_TOKEN],
            ['ephemeral-writer', process.env.JOB_TOKEN],
          ]) {
            if (!token) throw new Error('required diagnostic credential absent');
            for (const path of ['/releases/383267903', '/releases?per_page=100']) {
              const response = await fetch(
                'https://api.github.com/repos/d3vi1/nut-2-unifi-ups-gateway' + path,
                {
                  method: 'GET', redirect: 'error',
                  signal: AbortSignal.timeout(20000),
                  headers: {
                    Authorization: 'Bearer ' + token,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2026-03-10',
                  },
                },
              );
              const result = {credential, operation: path.includes('?') ? 'list' : 'numeric', httpStatus: response.status};
              if (response.ok) {
                const data = await response.json();
                const draft = Array.isArray(data) ? data.find(x => x.id === 383267903) : data;
                result.exactDraftVisible = draft?.id === 383267903 && draft?.tag_name === 'v0.9.0' && draft?.draft === true;
              }
              console.log(JSON.stringify(result));
            }
          }
          JS
