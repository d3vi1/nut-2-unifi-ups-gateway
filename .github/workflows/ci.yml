name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: true
      - name: Build isolated synthetic network laboratory
        run: |
          CGO_ENABLED=0 go test -c -o .network-lab/netagent-lab ./internal/netagent
          docker build -f deploy/test/network-lab.Dockerfile -t n2u-network-lab:ci .network-lab
      - name: DHCP lifecycle without a LAN attachment
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 64m \
            --tmpfs /run/n2u-network:rw,noexec,nosuid,size=64k,mode=0755 \
            -e N2U_ISOLATED_NETWORK_LAB=1 n2u-network-lab:ci \
            -test.run TestLinuxManagedNetworkLab -test.v -test.timeout 90s

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify four target architectures
        run: go test ./internal/buildtest -run TestCrossCompile -count=1

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up immutable Buildx and BuildKit
        id: buildx
        uses: ./.github/actions/setup-pinned-buildx
      - name: Build all release platforms without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.builder }}
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: false
          tags: ghcr.io/d3vi1/nut-2-unifi-ups-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate separate network Compose configuration without deployment
        env:
          N2U_IMAGE: example.invalid/n2u:test
          N2U_LAN_NETWORK: n2u-test-lan
          N2U_DEVICE_IP: 192.0.2.30
          N2U_DEVICE_MAC: 02:00:00:00:00:30
          N2U_NUT_ADDRESS: 172.30.90.1:3493
          N2U_NUT_HOST_NETWORK: n2u-test-host
          N2U_NUT_HOST_IP: 172.30.90.2
          N2U_INFORM_URL: http://192.0.2.1:8080/inform
        run: |
          docker compose --env-file /dev/null -f deploy/compose/compose.yaml config --quiet
          docker compose --env-file /dev/null -f deploy/compose/compose.yaml -f deploy/compose/compose.nut-host.yaml config --quiet
          docker compose --env-file /dev/null -f deploy/compose/compose.managed.yaml config --quiet
          docker compose --env-file /dev/null -f deploy/compose/compose.managed.yaml -f deploy/compose/compose.managed-nut-host.yaml config --quiet
