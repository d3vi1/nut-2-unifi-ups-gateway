name: Read-only attestation credential shape probe
on:
  push:
    branches: [release/attestation-path-0.9.0]
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-buildx
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inspect fixed paths and config shapes without values
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const object = v => v !== null && typeof v === 'object' && !Array.isArray(v);
          const inspect = (directory) => {
            const result = {directoryExists: fs.existsSync(directory)};
            if (!result.directoryExists) return result;
            const info = fs.lstatSync(directory);
            result.directory = info.isDirectory();
            result.symlink = info.isSymbolicLink();
            result.canonical = fs.realpathSync(directory) === path.resolve(directory);
            const file = path.join(directory, 'config.json');
            if (!fs.existsSync(file)) return {...result, fileExists: false};
            const fileInfo = fs.lstatSync(file);
            result.regularFile = fileInfo.isFile();
            result.fileSymlink = fileInfo.isSymbolicLink();
            result.bounded = fileInfo.size <= 65536;
            if (!result.regularFile || !result.bounded || result.fileSymlink) return result;
            let config;
            try { config = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { return {...result, json: false}; }
            result.jsonObject = object(config);
            result.authsObject = object(config.auths);
            result.authCount = Object.keys(config.auths ?? {}).length;
            result.hasGHCR = Object.hasOwn(config.auths ?? {}, 'ghcr.io');
            result.hasStore = Object.hasOwn(config, 'credsStore');
            result.hasHelpers = Object.hasOwn(config, 'credHelpers');
            result.hasHeaders = Object.hasOwn(config, 'HttpHeaders');
            const credential = config.auths?.['ghcr.io'];
            result.credentialObject = object(credential);
            result.credentialKeys = Object.keys(credential ?? {}).length;
            result.authString = typeof credential?.auth === 'string';
            result.authBase64 = result.authString && /^[A-Za-z0-9+/]+={0,2}$/.test(credential.auth);
            return result;
          };
          console.log(JSON.stringify({homeCanonical: fs.realpathSync(os.homedir()) === path.resolve(os.homedir()), isolated: inspect(process.env.DOCKER_CONFIG), target: inspect(path.join(os.homedir(), '.docker'))}));
          JAVASCRIPT
      - name: Exercise the exact credential bridge on the hosted runner
        run: node .github/scripts/attestation-auth.mjs prepare
      - name: Restore and scrub both credential stores
        if: success() || failure()
        run: node .github/scripts/attestation-auth.mjs cleanup
